# Draws the contribution "snake" used in the README's Activity section.
# Output lands on the `output` branch: github-snake.svg / github-snake-dark.svg
name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7C5CFF&color_dots=#EBEDF0,#C7D2FE,#A5B4FC,#818CF8,#6366F1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A77BFF&color_dots=#161B22,#1E3A8A,#2F5FD0,#4F8CFF,#7DD3FC

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
